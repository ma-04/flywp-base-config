# Speed up file transfer by using sendfile().
sendfile on;

# Don't send partial frames, which increases throughput.
tcp_nopush on;

# Don't wait to send data in keep-alive state.
tcp_nodelay on;

# SSL terminates at the reverse proxy, so the upstream request reaches this
# server over plain HTTP. Derive an HTTPS flag from the proxy's forwarded
# scheme and pass it to php-fpm (see common/php.conf) so apps generate correct
# https URLs and avoid mixed-content under SSL.
map $http_x_forwarded_proto $fastcgi_https {
    default '';
    https on;
}
